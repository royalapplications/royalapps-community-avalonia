name: Avalonia Packages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  # only allowed to read source code (ref. https://docs.github.com/en/actions/using-jobs/assigning-permissions-to-jobs)
  contents: read

jobs:

  build:

    strategy:
      matrix:
        configuration: [Release]

    runs-on: windows-latest

    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        persist-credentials: false

    # Install the .NET Core workload
    - name: Install .NET Core
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    # Build
    - name: test common project
      run: dotnet test -c Release RoyalApps.Community.Avalonia.Common.Tests/RoyalApps.Community.Avalonia.Common.Tests.csproj
      working-directory: src
      env:
        Configuration: ${{ matrix.configuration }}

    - name: build project
      run: dotnet build -c Release src/RoyalApps.Community.Avalonia.Windows/RoyalApps.Community.Avalonia.Windows.csproj
      env:
        Configuration: ${{ matrix.configuration }}

    - name: Pack Common
      run: dotnet pack --no-build -c Release src/RoyalApps.Community.Avalonia.Common/RoyalApps.Community.Avalonia.Common.csproj -o .

    # Pack nuget package
    - name: dotnet pack
      run: dotnet pack --no-build -c Release src/RoyalApps.Community.Avalonia.Windows/RoyalApps.Community.Avalonia.Windows.csproj -o .
      env:
        Configuration: ${{ matrix.configuration }}

    # Upload packages
    - name: Upload managed components
      uses: actions/upload-artifact@v7
      with:
        name: Avalonia-nupkg
        path: ./*.nupkg

    # Publication is a separate maintainer action after reviewing the release artifacts.
